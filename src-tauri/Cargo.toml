[package]
name = "prosperapp"
version = "0.0.2"
description = "Modern Personal Finance App"
authors = ["guilherme"]
edition = "2021"

[lib]
name = "prosper_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "uuid"] }
tokio = { version = "1", features = ["full"] }
keyring = "3"
argon2 = "0.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
libsqlite3-sys = { version = "0.28", features = ["bundled-sqlcipher"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
mime_guess = "2"
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2.7.1"

[profile.release]
panic = "abort" # Strip expensive panic hook
codegen-units = 1 # Optimize for size
lto = true # Enable Link Time Optimization
opt-level = "s" # Optimize for size
strip = true # Strip symbols
